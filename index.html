<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#4c5ce0">
<meta name="description" content="高考长难句翻译练习：848 条高考长难句，先自译再看参考译文，并支持中文在线翻译成英文。">
<title>高考长难句 · 翻译练习</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='24' fill='%234c5ce0'/><text x='50' y='70' font-size='58' text-anchor='middle' fill='white' font-family='serif'>句</text></svg>">
<style>
:root{
  --bg:#f3f5fa;
  --card:#ffffff;
  --ink:#151827;
  --ink-2:#3d4356;
  --muted:#7b8194;
  --line:#e8eaf3;
  --primary:#4c5ce0;
  --primary-deep:#3846c4;
  --primary-soft:#eceeff;
  --violet:#7c5cff;
  --green:#12a67c;
  --green-soft:#e6f7f1;
  --amber:#e8930c;
  --amber-soft:#fdf3e2;
  --red:#e2504a;
  --red-soft:#fdecea;
  --radius:20px;
  --shadow:0 1px 2px rgba(21,24,39,.04), 0 8px 24px -12px rgba(21,24,39,.14);
  --shadow-lg:0 18px 50px -18px rgba(21,24,39,.28);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Segoe UI","Microsoft YaHei",sans-serif;
  background:
    radial-gradient(900px 480px at 8% -8%, #e5e9ff 0%, rgba(229,233,255,0) 62%),
    radial-gradient(700px 420px at 100% 0%, #f0eaff 0%, rgba(240,234,255,0) 60%),
    var(--bg);
  color:var(--ink);
  min-height:100vh;
  -webkit-font-smoothing:antialiased;
  font-size:15px;
  line-height:1.55;
}
button{font-family:inherit;border:0;background:none;color:inherit;cursor:pointer;font-size:inherit}
input{font-family:inherit}
a{color:inherit;text-decoration:none}
::selection{background:#cfd4ff}

/* ---------- 布局 ---------- */
.sidebar{
  position:fixed;left:0;top:0;bottom:0;width:238px;
  background:rgba(255,255,255,.78);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border-right:1px solid var(--line);
  display:flex;flex-direction:column;padding:24px 16px;z-index:40;
}
.brand{display:flex;align-items:center;gap:11px;padding:0 8px 24px}
.brand-mark{
  width:38px;height:38px;border-radius:12px;flex:none;
  background:linear-gradient(145deg,var(--primary),var(--violet));
  color:#fff;display:grid;place-items:center;font-family:Georgia,"Songti SC",serif;font-size:21px;
  box-shadow:0 8px 18px -8px rgba(76,92,224,.7);
}
.brand-text b{display:block;font-size:15px;letter-spacing:.2px}
.brand-text span{font-size:11px;color:var(--muted);letter-spacing:1.6px}
.nav{display:flex;flex-direction:column;gap:4px}
.nav-item{
  display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:12px;
  color:var(--ink-2);transition:.18s;font-size:14px;width:100%;text-align:left;
}
.nav-item svg{width:18px;height:18px;stroke-width:1.9}
.nav-item:hover{background:#f3f4fb}
.nav-item.active{background:var(--primary-soft);color:var(--primary);font-weight:600}
.nav-item .badge{
  margin-left:auto;background:var(--primary);color:#fff;font-size:11px;
  min-width:20px;height:20px;border-radius:10px;display:grid;place-items:center;padding:0 6px;
}
.nav-item.active .badge{background:var(--primary)}
.side-foot{margin-top:auto;display:flex;flex-direction:column;gap:12px}
.share-card{
  border-radius:16px;padding:14px;background:linear-gradient(150deg,#eef0ff,#f7f0ff);
  border:1px solid #e4e5ff;
}
.share-card b{font-size:13px;display:block;margin-bottom:2px}
.share-card p{margin:0 0 10px;font-size:11.5px;color:var(--muted);line-height:1.5}
.share-card .btn{padding:7px 12px;font-size:12px;border-radius:9px}
.side-note{font-size:11px;color:#a2a7b8;padding:0 4px;line-height:1.6}

main{margin-left:238px;padding:26px 40px 90px;max-width:1080px}
.topbar{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:22px}
.page-title{font-size:25px;font-weight:700;letter-spacing:-.4px;line-height:1.25}
.page-sub{font-size:12.5px;color:var(--muted);margin-top:3px}
.top-actions{display:flex;gap:8px;align-items:center;flex:none}
.icon-btn{
  width:38px;height:38px;border-radius:11px;display:grid;place-items:center;
  border:1px solid var(--line);background:#fff;color:var(--ink-2);transition:.16s;
}
.icon-btn:hover{color:var(--primary);border-color:#d6d9ff;background:#fbfbff}
.icon-btn svg{width:18px;height:18px;stroke-width:1.9}
.streak-chip{
  display:flex;align-items:center;gap:6px;height:38px;padding:0 13px;border-radius:11px;
  background:#fff;border:1px solid var(--line);font-size:12.5px;color:var(--ink-2);
}
.streak-chip b{color:var(--amber);font-size:14px}

/* ---------- 通用组件 ---------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:7px;
  padding:11px 20px;border-radius:12px;font-size:14px;font-weight:600;
  transition:.16s;white-space:nowrap;border:1px solid transparent;
}
.btn svg{width:16px;height:16px;stroke-width:2}
.btn.primary{background:linear-gradient(145deg,var(--primary),#5c6bf0);color:#fff;box-shadow:0 8px 20px -10px rgba(76,92,224,.9)}
.btn.primary:hover{transform:translateY(-1px);box-shadow:0 12px 24px -10px rgba(76,92,224,.9)}
.btn.soft{background:var(--primary-soft);color:var(--primary)}
.btn.soft:hover{background:#e2e5ff}
.btn.ghost{border-color:var(--line);background:#fff;color:var(--ink-2)}
.btn.ghost:hover{border-color:#cfd4ee}
.btn.danger{background:var(--red-soft);color:var(--red)}
.btn.block{width:100%}
.btn.lg{padding:13px 24px;font-size:15px;border-radius:13px}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none!important;box-shadow:none}
.seg{display:inline-flex;background:#f1f2f9;border-radius:11px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{padding:7px 14px;border-radius:9px;font-size:13px;color:var(--muted);font-weight:500;transition:.16s}
.seg button.on{background:#fff;color:var(--primary);font-weight:600;box-shadow:0 2px 8px rgba(21,24,39,.08)}
.chip{
  display:inline-flex;align-items:center;gap:5px;padding:5px 11px;border-radius:999px;
  font-size:12px;background:#f2f3fa;color:var(--muted);border:1px solid transparent;
}
.chip.on{background:var(--primary-soft);color:var(--primary);border-color:#dfe2ff;font-weight:600}
.muted{color:var(--muted)}
.small{font-size:12.5px}
.divider{height:1px;background:var(--line);margin:16px 0}
.pos{
  display:inline-block;font-size:10.5px;font-weight:700;letter-spacing:.3px;color:#8b6cd8;
  background:#f3efff;border-radius:5px;padding:1px 5px;margin-right:6px;text-transform:lowercase;
  vertical-align:1px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
}

/* ---------- 学习首页 ---------- */
.hero{
  position:relative;overflow:hidden;border-radius:24px;padding:26px 28px 24px;color:#fff;
  background:linear-gradient(130deg,#3b46cf 0%,#5a5bea 45%,#7c5cff 100%);
  box-shadow:0 24px 50px -28px rgba(58,68,207,.9);
}
.hero:after{
  content:"";position:absolute;width:340px;height:340px;border-radius:50%;right:-120px;top:-170px;
  background:radial-gradient(circle,rgba(255,255,255,.26),rgba(255,255,255,0) 68%);
}
.hero:before{
  content:"";position:absolute;width:220px;height:220px;border-radius:50%;right:70px;bottom:-160px;
  background:radial-gradient(circle,rgba(255,255,255,.16),rgba(255,255,255,0) 70%);
}
.hero-date{font-size:12px;opacity:.82;letter-spacing:.6px;position:relative}
.hero h1{font-size:27px;margin:7px 0 4px;letter-spacing:-.4px;position:relative;font-weight:700}
.hero p{margin:0;font-size:13px;opacity:.85;position:relative}
.hero-row{display:flex;gap:26px;margin:22px 0 20px;position:relative;flex-wrap:wrap}
.hero-stat b{display:block;font-size:24px;line-height:1.2;font-weight:700;font-variant-numeric:tabular-nums}
.hero-stat span{font-size:11.5px;opacity:.82}
.hero-btn{background:#fff;color:var(--primary);box-shadow:0 10px 24px -12px rgba(0,0,0,.5);position:relative}
.hero-btn:hover{background:#fff;transform:translateY(-1px)}
.hero-btn.alt{background:rgba(255,255,255,.16);color:#fff;box-shadow:none;border:1px solid rgba(255,255,255,.3)}
.hero-btn.alt:hover{background:rgba(255,255,255,.24)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:18px}
.panel{padding:20px 22px}
.panel-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:6px}
.panel-title{font-size:14px;font-weight:700;letter-spacing:.1px}
.panel-desc{font-size:12.5px;color:var(--muted);margin:2px 0 14px;line-height:1.6}
.goal-chips{display:flex;gap:6px;flex-wrap:wrap}
.hint-card{
  margin-top:18px;display:flex;gap:12px;align-items:flex-start;padding:16px 18px;
  border-radius:16px;background:#fffdf7;border:1px solid #f4e9cf;color:#8a6d2f;font-size:12.5px;line-height:1.65;
}
.hint-card b{color:#6d5318}

/* ---------- 学习卡片 ---------- */
.session-head{display:flex;align-items:center;gap:14px;margin-bottom:16px}
.session-progress{flex:1;height:6px;border-radius:99px;background:#e7e9f4;overflow:hidden}
.session-progress i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--primary),var(--violet));transition:width .35s}
.session-count{font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums;min-width:46px;text-align:right}
.study-card{
  padding:26px 30px 22px;min-height:440px;max-height:calc(100vh - 185px);overflow:hidden;
  display:flex;flex-direction:column;animation:rise .32s cubic-bezier(.22,.9,.3,1);
}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.word-top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.headword{
  font-family:Georgia,"Times New Roman","Songti SC",serif;
  font-size:42px;line-height:1.15;margin:0 0 8px;letter-spacing:-.5px;word-break:break-word;
}
.freq-tag{
  display:inline-block;margin-left:8px;padding:2px 8px;font-size:11px;font-weight:600;
  color:#fff;background:linear-gradient(135deg,#ff7a45,#ff4d4f);border-radius:6px;
  vertical-align:middle;letter-spacing:.5px;
}
.word-row .freq-tag{font-size:10px;padding:1px 6px;margin-left:6px;}
.phon-row{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:14px}
.speak{
  width:30px;height:30px;border-radius:9px;display:grid;place-items:center;color:var(--primary);
  background:var(--primary-soft);transition:.16s;
}
.speak:hover{background:#e0e4ff;transform:scale(1.05)}
.speak svg{width:15px;height:15px}
.word-badge{
  font-size:11px;padding:4px 9px;border-radius:99px;background:var(--red-soft);color:var(--red);
  font-weight:600;flex:none;
}
.reveal-area{
  flex:1;display:flex;flex-direction:column;justify-content:flex-start;padding:20px 6px 6px 0;
  overflow-y:auto;overscroll-behavior:contain;scrollbar-width:thin;scrollbar-color:#d8dbe8 transparent;
}
.reveal-area::-webkit-scrollbar{width:5px}
.reveal-area::-webkit-scrollbar-thumb{background:#dcdfeb;border-radius:99px}
.front-hint{
  text-align:center;padding:28px 0;color:var(--muted);cursor:pointer;user-select:none;margin:auto 0;width:100%;
}
.front-hint .eye{
  width:52px;height:52px;border-radius:50%;margin:0 auto 12px;display:grid;place-items:center;
  background:#f4f5fb;color:#9aa0b6;animation:pulse 2.4s ease-in-out infinite;
}
@keyframes pulse{0%,100%{transform:translateY(0);box-shadow:0 0 0 0 rgba(76,92,224,.12)}50%{transform:translateY(-3px);box-shadow:0 0 0 12px rgba(76,92,224,0)}}
.front-hint b{display:block;color:var(--ink-2);font-size:14px;margin-bottom:3px}
.front-hint span{font-size:12px}
.senses{animation:fade .28s ease}
@keyframes fade{from{opacity:0}to{opacity:1}}
.sense{display:flex;gap:2px;padding:5px 0;font-size:16.5px;color:var(--ink);line-height:1.65}
.sense .pos{margin-top:4px}
.en-def{font-size:12.5px;color:#9096aa;line-height:1.6;margin:2px 0 6px;font-style:italic}
.block{margin-top:16px;padding-top:14px;border-top:1px dashed #e6e8f2}
.block-label{font-size:11px;color:#9aa0b6;letter-spacing:1.2px;font-weight:700;margin-bottom:7px}
.example{font-size:14.5px;line-height:1.7;color:var(--ink-2)}
.example .en{font-family:Georgia,"Times New Roman",serif}
.example .cn{font-size:12.5px;color:var(--muted);margin-top:3px}
.example + .example{margin-top:9px}
.example em{font-style:normal;color:var(--primary);font-weight:600;background:#f0f2ff;border-radius:3px;padding:0 2px}
.phrase{display:flex;gap:10px;font-size:13px;padding:3px 0}
.phrase .en{font-family:Georgia,serif;color:var(--ink-2);white-space:nowrap}
.phrase .cn{color:var(--muted)}
.memo{font-size:13px;color:#6b5b9a;background:#f8f5ff;border-radius:10px;padding:10px 12px;line-height:1.65}
.exam{font-size:13px;line-height:1.7;color:var(--ink-2)}
.exam .src{font-size:11px;color:#9aa0b6;margin-top:4px}
.rate-bar{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:18px}
.rate-btn{
  padding:11px 8px;border-radius:13px;text-align:center;border:1px solid transparent;transition:.16s;
}
.rate-btn b{display:block;font-size:14px;font-weight:600}
.rate-btn span{display:block;font-size:10.5px;opacity:.68;margin-top:1px}
.rate-btn:hover{transform:translateY(-1px)}
.rate-btn:disabled{opacity:.42;cursor:not-allowed;transform:none;filter:grayscale(.35)}
.rate-btn.dont{background:var(--red-soft);color:var(--red)}
.rate-btn.dont:hover{background:#fbe0de}
.rate-btn.fuzzy{background:var(--amber-soft);color:#b8730a}
.rate-btn.fuzzy:hover{background:#fbeacf}
.rate-btn.know{background:var(--green-soft);color:#0b8a67}
.rate-btn.know:hover{background:#d9f2e9}
.keyboard-hint{text-align:center;font-size:11px;color:#a8adbd;margin-top:12px}
.keyboard-hint kbd{
  font-family:inherit;background:#f2f3f9;border:1px solid #e5e7f0;border-radius:4px;
  padding:0 4px;font-size:10px;color:#8a90a4;
}
.session-summary{text-align:center;padding:44px 30px 36px;animation:rise .32s}
.summary-icon{
  width:66px;height:66px;border-radius:50%;margin:0 auto 16px;display:grid;place-items:center;
  background:linear-gradient(145deg,#e8f8f2,#d5f2e8);color:var(--green);
}
.session-summary h2{font-size:23px;margin:0 0 6px;letter-spacing:-.3px}
.session-summary p{margin:0;color:var(--muted);font-size:13px}
.summary-stats{display:flex;justify-content:center;gap:28px;margin:26px 0 28px}
.summary-stats b{display:block;font-size:22px;font-variant-numeric:tabular-nums}
.summary-stats span{font-size:11.5px;color:var(--muted)}
.summary-actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}

/* ---------- 复习 ---------- */
.section-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:22px 0 12px}
.section-title{font-size:15px;font-weight:700}
.due-card{padding:24px;text-align:center}
.due-num{font-size:52px;font-weight:700;line-height:1;letter-spacing:-2px;font-variant-numeric:tabular-nums;
  background:linear-gradient(150deg,var(--primary),var(--violet));-webkit-background-clip:text;background-clip:text;color:transparent}
.due-label{font-size:12.5px;color:var(--muted);margin:7px 0 18px}
.due-preview{margin-top:18px;text-align:left;border-top:1px solid var(--line);padding-top:6px}
.word-row{
  display:flex;align-items:center;gap:12px;padding:11px 6px;border-bottom:1px solid #f1f2f8;
  cursor:pointer;transition:.14s;width:100%;text-align:left;
}
.word-row:last-child{border-bottom:0}
.word-row:hover{background:#fafbff}
.word-row .w{font-family:Georgia,serif;font-size:16.5px;min-width:0;white-space:nowrap}
.word-row .m{font-size:12.5px;color:var(--muted);flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.word-row .dot{width:7px;height:7px;border-radius:50%;flex:none}
.dot.new{background:#c8ccdb}
.dot.learning{background:var(--amber)}
.dot.mastered{background:var(--green)}
.dot.book{background:var(--red)}
.empty-state{padding:52px 24px;text-align:center}
.empty-state .ic{
  width:60px;height:60px;border-radius:50%;margin:0 auto 14px;display:grid;place-items:center;
  background:#f1f3fa;color:#a3a9bd;
}
.empty-state h3{margin:0 0 5px;font-size:16px}
.empty-state p{margin:0;font-size:12.5px;color:var(--muted);line-height:1.7}
.tiny-progress{font-size:11px;color:#a3a9bd}

/* ---------- 测试 ---------- */
.quiz-setup{padding:26px 28px}
.quiz-setup h2{margin:0 0 4px;font-size:20px;letter-spacing:-.3px}
.quiz-setup .muted{margin:0 0 22px;font-size:12.5px}
.form-row{margin-bottom:20px}
.form-label{font-size:12px;color:#8b91a5;font-weight:600;letter-spacing:.4px;margin-bottom:8px}
.quiz-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;font-size:12.5px;color:var(--muted)}
.quiz-card{padding:26px 28px}
.q-label{font-size:11px;letter-spacing:1.4px;color:#9aa0b6;font-weight:700;margin-bottom:12px}
.q-prompt{font-size:32px;line-height:1.3;margin-bottom:22px;letter-spacing:-.3px;word-break:break-word}
.q-prompt.cn{font-family:inherit;font-size:21px;line-height:1.55;font-weight:600}
.q-prompt .pos{vertical-align:3px}
.options{display:flex;flex-direction:column;gap:9px}
.option{
  display:flex;align-items:flex-start;gap:11px;padding:13px 15px;border-radius:12px;
  border:1px solid var(--line);background:#fff;text-align:left;transition:.14s;font-size:14.5px;line-height:1.5;
}
.option:hover{border-color:#c8cdf8;background:#fbfbff}
.option .k{
  width:23px;height:23px;border-radius:7px;background:#f1f3fa;color:#8b91a5;flex:none;
  display:grid;place-items:center;font-size:11.5px;font-weight:700;margin-top:-1px;
}
.option.correct{border-color:#a8e0cd;background:#f1fbf7}
.option.correct .k{background:var(--green);color:#fff}
.option.wrong{border-color:#f3c4c1;background:#fdf3f2}
.option.wrong .k{background:var(--red);color:#fff}
.option.dim{opacity:.55}
.option:disabled{cursor:default}
.feedback{margin-top:16px;border-radius:14px;padding:14px 16px;background:#f8f9fd;border:1px solid var(--line);animation:fade .2s}
.feedback b{font-size:13.5px}
.feedback .ans{font-size:13px;color:var(--ink-2);margin-top:3px}
.feedback .eg{font-size:12px;color:var(--muted);margin-top:6px;line-height:1.65}
.result{padding:32px 28px;text-align:center}
.donut{
  width:130px;height:130px;border-radius:50%;margin:0 auto 18px;display:grid;place-items:center;
  position:relative;
}
.donut:after{content:"";position:absolute;inset:11px;background:#fff;border-radius:50%}
.donut span{position:relative;z-index:1;font-size:31px;font-weight:700;letter-spacing:-1px;font-variant-numeric:tabular-nums}
.result h2{margin:0 0 4px;font-size:21px}
.result p{margin:0;color:var(--muted);font-size:12.5px}
.result .summary-actions{margin-top:24px}
.wrong-box{margin-top:24px;text-align:left;border-top:1px solid var(--line);padding-top:18px}
.wrong-box h3{font-size:13px;margin:0 0 10px;color:var(--muted);font-weight:600;letter-spacing:.3px}
.wrong-item{padding:11px 0;border-bottom:1px solid #f2f3f9;font-size:13.5px;display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.wrong-item .w{font-family:Georgia,serif;font-size:16px;color:var(--red)}
.wrong-item .right{color:var(--ink-2)}
.wrong-item .yours{font-size:12px;color:#a3a9bd;text-decoration:line-through}

/* ---------- 数据 ---------- */
.stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.stat{padding:18px 18px 16px}
.stat .k{font-size:11.5px;color:var(--muted);margin-bottom:8px;display:flex;align-items:center;gap:5px}
.stat b{font-size:26px;font-weight:700;letter-spacing:-.7px;font-variant-numeric:tabular-nums;line-height:1.1}
.stat b small{font-size:12px;font-weight:500;color:#a3a9bd;letter-spacing:0;margin-left:3px}
.stat .foot{font-size:11.5px;color:#a3a9bd;margin-top:5px}
.chart-card{padding:20px 22px;margin-top:14px}
.chart{display:flex;align-items:flex-end;gap:6px;height:150px;margin:18px 0 6px}
.bar-col{flex:1;display:flex;flex-direction:column;align-items:center;height:100%;justify-content:flex-end;gap:6px;min-width:0}
.bar-stack{width:100%;max-width:26px;height:118px;display:flex;flex-direction:column-reverse;justify-content:flex-start;border-radius:6px;overflow:hidden;background:#f4f5fb;position:relative}
.bar-stack i{display:block;width:100%;transition:height .4s}
.bar-stack .learn{background:linear-gradient(180deg,#6573ee,#4c5ce0)}
.bar-stack .rev{background:#cfd5ff}
.bar-stack .zero{position:absolute;bottom:0;left:0;right:0;height:3px;background:#e2e4ef}
.bar-stack.empty{background:transparent;border-bottom:3px solid #eceef6;border-radius:3px 3px 0 0}
.bar-col em{font-size:9.5px;color:#a8adbd;font-style:normal;white-space:nowrap;transform:scale(.92)}
.legend{display:flex;gap:16px;font-size:11.5px;color:var(--muted);margin-top:8px}
.legend i{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:5px}
.mastery{margin-top:14px}
.mastery-bar{display:flex;height:12px;border-radius:99px;overflow:hidden;background:#f0f1f8;margin:12px 0}
.mastery-bar i{display:block;height:100%;transition:width .4s}
.mastery-legend{display:flex;flex-wrap:wrap;gap:14px;font-size:11.5px;color:var(--muted)}
.mastery-legend i{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:5px}
.tools{display:flex;gap:10px;flex-wrap:wrap}
.data-card{padding:20px 22px;margin-top:14px}

/* ---------- 词库 ---------- */
.lib-tools{display:flex;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.search{
  flex:1;min-width:180px;display:flex;align-items:center;gap:8px;padding:0 13px;height:42px;
  background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);
}
.search svg{width:16px;height:16px;color:#a3a9bd;flex:none}
.search input{border:0;outline:0;background:none;flex:1;font-size:14px;color:var(--ink);min-width:0}
.search input::placeholder{color:#b0b5c6}
.letter-bar{display:flex;gap:3px;overflow-x:auto;padding-bottom:6px;margin-bottom:10px;scrollbar-width:none}
.letter-bar::-webkit-scrollbar{display:none}
.letter-bar button{
  flex:none;width:26px;height:26px;border-radius:7px;font-size:11.5px;color:#8b91a5;font-weight:600;
}
.letter-bar button:hover{background:#eef0f9}
.letter-bar button.on{background:var(--primary);color:#fff}
.lib-count{font-size:11.5px;color:#a3a9bd;margin:4px 0 10px}
.lib-list{padding:4px 12px}
.lib-list .word-row{padding:11px 4px}
.lib-list .w{font-size:17px}
.route-badge{font-size:10px;color:#8b91a5;background:#f2f3fa;border-radius:5px;padding:1px 6px;flex:none}
.load-more{display:flex;justify-content:center;padding:16px 0 4px}

/* ---------- 底部弹层 ---------- */
.overlay{
  position:fixed;inset:0;background:rgba(19,22,35,.42);z-index:60;
  opacity:0;pointer-events:none;transition:opacity .22s;backdrop-filter:blur(2px);
}
.overlay.show{opacity:1;pointer-events:auto}
.sheet{
  position:fixed;left:50%;bottom:0;transform:translate(-50%,105%);width:100%;max-width:620px;
  max-height:86vh;background:#fff;border-radius:24px 24px 0 0;z-index:70;
  transition:transform .3s cubic-bezier(.22,.9,.3,1);display:flex;flex-direction:column;
  box-shadow:var(--shadow-lg);
}
.sheet.show{transform:translate(-50%,0)}
.sheet-grip{width:38px;height:4px;border-radius:99px;background:#e3e5ef;margin:10px auto 0;flex:none}
.sheet-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding:14px 24px 10px;flex:none}
.sheet-body{overflow-y:auto;padding:0 24px 26px;overscroll-behavior:contain}
.sheet .headword{font-size:33px;margin-bottom:5px}
.sheet-actions{display:flex;gap:8px;margin-top:20px;flex-wrap:wrap}
.modal{
  position:fixed;left:50%;top:50%;transform:translate(-50%,-46%) scale(.96);z-index:70;
  width:calc(100% - 32px);max-width:380px;background:#fff;border-radius:22px;padding:26px 24px 22px;
  opacity:0;pointer-events:none;transition:.24s;box-shadow:var(--shadow-lg);text-align:center;
}
.modal.show{opacity:1;pointer-events:auto;transform:translate(-50%,-50%) scale(1)}
.modal h2{font-size:18px;margin:0 0 4px;letter-spacing:-.2px}
.modal p{font-size:12.5px;color:var(--muted);margin:0 0 18px;line-height:1.65}
.qr-wrap{width:220px;height:220px;margin:0 auto 14px;display:grid;place-items:center;background:#fff;border-radius:14px;border:1px solid var(--line);padding:10px;overflow:hidden}
.qr-wrap img,.qr-wrap canvas{max-width:100%;height:auto!important;display:block}
.link-box{display:flex;gap:8px;margin-top:6px}
.link-box input{
  flex:1;min-width:0;height:38px;border:1px solid var(--line);border-radius:10px;padding:0 10px;
  font-size:11.5px;color:#6b7280;background:#fafbff;outline:0;
}
.link-box .btn{padding:0 13px;height:38px;font-size:12px;border-radius:10px}
.share-tip{font-size:11px;color:#a3a9bd;margin-top:10px;line-height:1.6}
.share-warn{font-size:11.5px;color:#b8730a;background:#fff8ea;border:1px solid #f5e5c5;border-radius:9px;padding:8px 10px;margin-bottom:12px;line-height:1.6}

/* ---------- 提示 ---------- */
#toast{
  position:fixed;left:50%;bottom:88px;transform:translate(-50%,16px);z-index:90;
  background:#22273a;color:#fff;font-size:12.5px;padding:9px 16px;border-radius:10px;
  opacity:0;pointer-events:none;transition:.25s;box-shadow:0 10px 26px -10px rgba(0,0,0,.5);
  max-width:80vw;text-align:center;
}
#toast.show{opacity:1;transform:translate(-50%,0)}
#boot{
  position:fixed;inset:0;z-index:200;background:var(--bg);display:grid;place-items:center;
  transition:opacity .35s;
}
#boot.hide{opacity:0;pointer-events:none}
.boot-mark{
  width:52px;height:52px;border-radius:15px;margin:0 auto 16px;
  background:linear-gradient(145deg,var(--primary),var(--violet));color:#fff;
  display:grid;place-items:center;font-family:Georgia,"Songti SC",serif;font-size:28px;
  animation:breathe 1.6s ease-in-out infinite;
}
@keyframes breathe{0%,100%{transform:scale(1);box-shadow:0 8px 26px -10px rgba(76,92,224,.8)}50%{transform:scale(1.06);box-shadow:0 14px 34px -10px rgba(76,92,224,.9)}}
.boot-text{text-align:center;font-size:12.5px;color:var(--muted);letter-spacing:1.5px}

.tabbar{display:none}
@media (max-width:900px){
  .sidebar{display:none}
  main{margin-left:0;padding:16px 14px calc(92px + env(safe-area-inset-bottom));max-width:none}
  .topbar{margin-bottom:16px;align-items:center}
  .page-title{font-size:21px}
  .page-sub{display:none}
  .top-actions .streak-chip{display:none}
  .hero{padding:22px 20px;border-radius:20px}
  .hero h1{font-size:23px}
  .hero-row{gap:22px;margin:18px 0}
  .hero-stat b{font-size:21px}
  .grid2{grid-template-columns:1fr;gap:12px}
  .stat-grid{grid-template-columns:1fr 1fr;gap:10px}
  .stat b{font-size:23px}
  .study-card{padding:20px 18px 16px;min-height:420px;max-height:calc(100vh - 235px);border-radius:20px}
  .headword{font-size:35px}
  .rate-btn{padding:12px 6px}
  .rate-btn b{font-size:13.5px}
  .rate-btn span{font-size:10px}
  .tabbar{
    position:fixed;left:0;right:0;bottom:0;z-index:50;display:flex;
    background:rgba(255,255,255,.94);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
    border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom));
  }
  .tab{
    flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:7px 0 5px;
    color:#9aa0b6;font-size:10px;border-radius:10px;transition:.15s;position:relative;
  }
  .tab svg{width:21px;height:21px;stroke-width:1.85}
  .tab.active{color:var(--primary)}
  .tab .badge{
    position:absolute;top:2px;left:calc(50% + 6px);background:var(--red);color:#fff;
    font-size:9px;min-width:15px;height:15px;border-radius:8px;display:grid;place-items:center;padding:0 4px;
  }
  .sheet{max-height:90vh}
  .sheet-head{padding:14px 18px 8px}
  .sheet-body{padding:0 18px 24px}
  .quiz-setup,.quiz-card,.result,.panel{padding:20px 18px}
  .q-prompt{font-size:27px}
  .chart{height:128px}
  .bar-stack{height:100px}
  .modal{padding:22px 18px 18px}
  .qr-wrap{width:200px;height:200px}
}
@media (max-width:420px){
  .hero-row{gap:16px}
  .hero-stat b{font-size:19px}
  .headword{font-size:31px}
  .summary-stats{gap:18px}
}

/* ================= 长难句站点专用样式 ================= */
.diff-tag{
  display:inline-flex;align-items:center;gap:4px;height:22px;padding:0 9px;border-radius:7px;
  font-size:11.5px;font-weight:600;letter-spacing:.2px;
}
.diff-tag.d1{background:var(--green-soft);color:var(--green)}
.diff-tag.d2{background:var(--amber-soft);color:var(--amber)}
.diff-tag.d3{background:var(--red-soft);color:var(--red)}
.sent-card{padding:26px 28px 22px;position:relative;overflow:hidden}
.sent-card:before{
  content:"";position:absolute;left:0;top:0;bottom:0;width:4px;
  background:linear-gradient(180deg,var(--primary),var(--violet));
}
.sent-meta{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:18px}
.sent-no{font-size:12px;color:var(--muted);font-weight:600;letter-spacing:.5px}
.struct-chip{
  display:inline-flex;align-items:center;height:22px;padding:0 8px;border-radius:7px;
  background:#f3f4fb;border:1px solid #e6e8f5;color:var(--ink-2);font-size:11.5px;
}
.exam-tag{
  display:inline-flex;align-items:center;gap:4px;height:22px;padding:0 9px;border-radius:7px;
  background:linear-gradient(145deg,#eaf0ff,#f3ecff);border:1px solid #dde3fb;
  color:#3b50c9;font-size:11.5px;font-weight:700;letter-spacing:.2px;
}
.exam-tag svg{stroke-width:2.1}
/* 历年真题页 */
.exam-hero{
  display:flex;align-items:center;gap:18px;flex-wrap:wrap;
  background:linear-gradient(140deg,#eef1ff 0%,#f7f0ff 60%,#fff 100%);
  border:1px solid #e3e6fb;border-radius:var(--radius);padding:20px 22px;margin-bottom:14px;
}
.exam-hero .eh-mark{
  width:48px;height:48px;border-radius:15px;flex:none;display:grid;place-items:center;
  background:linear-gradient(145deg,var(--primary),var(--violet));color:#fff;
  box-shadow:0 10px 22px -10px rgba(76,92,224,.85);
}
.exam-hero .eh-txt{flex:1;min-width:180px}
.exam-hero .eh-txt b{display:block;font-size:17px;letter-spacing:-.2px}
.exam-hero .eh-txt span{font-size:12.5px;color:var(--muted);line-height:1.6}
.exam-hero .eh-stats{display:flex;gap:22px;flex-wrap:wrap}
.exam-hero .eh-stats div{text-align:center}
.exam-hero .eh-stats b{display:block;font-size:21px;letter-spacing:-.4px;color:var(--primary)}
.exam-hero .eh-stats span{font-size:11.5px;color:var(--muted)}
.year-bar{
  display:flex;gap:6px;overflow-x:auto;padding:2px 0 10px;margin-bottom:6px;
  scrollbar-width:thin;
}
.year-bar::-webkit-scrollbar{height:5px}
.year-bar::-webkit-scrollbar-thumb{background:#d8dcf0;border-radius:3px}
.year-bar button{
  flex:none;padding:7px 13px;border-radius:9px;border:1px solid var(--line);background:#fff;
  font-size:12.5px;color:var(--ink-2);transition:.15s;white-space:nowrap;
}
.year-bar button:hover{border-color:#c9cfff;color:var(--primary)}
.year-bar button.on{background:var(--primary);border-color:var(--primary);color:#fff;font-weight:600}
.year-head{
  display:flex;align-items:center;gap:10px;margin:18px 0 8px;
  padding:0 2px;position:sticky;top:0;background:rgba(243,245,250,.94);
  backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);z-index:2;padding-top:6px;padding-bottom:6px;
}
.year-head b{font-size:15px;letter-spacing:-.2px}
.year-head span{font-size:12px;color:var(--muted)}
.year-head .btn{margin-left:auto;padding:6px 12px;font-size:12px;border-radius:8px}

.sent-en{
  font-family:Georgia,"Times New Roman","Songti SC",serif;
  font-size:21.5px;line-height:1.78;color:var(--ink);letter-spacing:.15px;
  margin:0 0 4px;
}
.sent-en em.conj{
  font-style:normal;color:var(--primary);font-weight:700;
  background:var(--primary-soft);border-radius:4px;padding:0 3px;
}
.wc-hint{font-size:12px;color:var(--muted);margin-top:10px}
.answer-zone{margin-top:20px;border-top:1px dashed #e2e5f2;padding-top:18px}
.answer-zone.locked{border-top-style:dashed}
.answer-placeholder{
  display:flex;align-items:center;justify-content:space-between;gap:14px;
  background:#fafbff;border:1px dashed #dfe2f2;border-radius:13px;padding:13px 16px;
}
.answer-placeholder .ph-txt{font-size:13px;color:var(--muted);line-height:1.6}
.answer-placeholder .ph-txt b{display:block;color:var(--ink-2);font-size:13.5px;margin-bottom:2px}
.sent-cn{font-size:16.5px;line-height:1.95;color:var(--ink-2);margin:0}
.sent-cn-in{animation:cnIn .42s cubic-bezier(.2,.8,.3,1) both}
@keyframes cnIn{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}
@keyframes ansFade{from{opacity:0}to{opacity:1}}
.src-line{font-size:12px;color:var(--muted);margin-top:14px;display:flex;align-items:center;gap:6px}
.src-line svg{width:13px;height:13px;stroke-width:2;flex:none}
.rate-bar.three .rate-btn{flex:1}
.rate-btn.star.on{background:var(--amber-soft);color:var(--amber)}
.practice-top{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:16px;flex-wrap:wrap}
.practice-opts{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.mini-seg{
  display:inline-flex;background:#f0f2fa;border:1px solid var(--line);border-radius:10px;
  padding:2px;gap:2px;
}
.mini-seg button{
  padding:6px 12px;border-radius:8px;font-size:12.5px;color:var(--ink-2);transition:.15s;
}
.mini-seg button.on{background:#fff;color:var(--primary);font-weight:600;box-shadow:0 1px 4px rgba(21,24,39,.1)}
.sess-bar{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.sess-bar .track{flex:1;height:7px;border-radius:4px;background:#eceef8;overflow:hidden}
.sess-bar .track i{display:block;height:100%;border-radius:4px;background:linear-gradient(90deg,var(--primary),var(--violet));transition:width .4s}
.sess-bar .txt{font-size:12px;color:var(--muted);white-space:nowrap}

/* 中译英 */
.tr-wrap{display:grid;grid-template-columns:1fr 1fr;gap:18px}
@media (max-width:900px){.tr-wrap{grid-template-columns:1fr}}
.tr-col{display:flex;flex-direction:column}
.tr-label{font-size:12.5px;font-weight:600;color:var(--ink-2);margin-bottom:8px;display:flex;align-items:center;gap:6px}
.tr-label .dot-mark{width:6px;height:6px;border-radius:3px;background:var(--primary)}
.tr-col.out .tr-label .dot-mark{background:var(--green)}
textarea.tr-input{
  width:100%;min-height:168px;resize:vertical;border:1px solid var(--line);border-radius:14px;
  padding:14px 16px;font-size:14.5px;line-height:1.75;color:var(--ink);background:#fff;
  font-family:inherit;outline:none;transition:.16s;
}
textarea.tr-input:focus{border-color:#c3c9ff;box-shadow:0 0 0 3px rgba(76,92,224,.1)}
.tr-out-box{
  border:1px solid var(--line);border-radius:14px;padding:14px 16px;background:#fafbff;
  min-height:168px;font-family:Georgia,"Times New Roman",serif;font-size:17px;line-height:1.8;
  color:var(--ink);word-break:break-word;
}
.tr-out-box.empty{display:flex;align-items:center;justify-content:center;text-align:center;color:var(--muted);font-family:inherit;font-size:13px;line-height:1.7}
.tr-actions{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.tr-tools{display:flex;gap:6px;margin-top:10px}
.tr-ref{
  margin-top:14px;border:1px solid #e4e7f7;background:linear-gradient(150deg,#f6f7ff,#fbf7ff);
  border-radius:13px;padding:13px 16px;
}
.tr-ref .rh{font-size:11.5px;font-weight:700;color:var(--primary);letter-spacing:.4px;margin-bottom:6px}
.tr-ref .re{font-family:Georgia,serif;font-size:15px;line-height:1.7;color:var(--ink);margin-bottom:5px}
.tr-ref .rc{font-size:12.5px;color:var(--muted);line-height:1.6}
.tr-samples{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.tr-samples button{
  padding:6px 11px;border-radius:9px;border:1px solid var(--line);background:#fff;
  font-size:12px;color:var(--ink-2);transition:.15s;
}
.tr-samples button:hover{border-color:#c9cfff;color:var(--primary);background:#fbfbff}
.tr-note{font-size:11.5px;color:var(--muted);line-height:1.65;margin-top:12px}
.spin{animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* 句库行 */
.slib-row{border-bottom:1px solid #f1f2f8;padding:13px 4px;transition:.15s}
.slib-row:last-child{border-bottom:0}
.slib-row.open{background:#fafbff;border-radius:12px;padding:13px 12px;margin:0 -8px}
.slib-head{display:flex;align-items:flex-start;gap:10px;cursor:pointer}
.slib-en{flex:1;font-family:Georgia,serif;font-size:14.5px;line-height:1.65;color:var(--ink)}
.slib-en.clamp{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.slib-side{display:flex;gap:5px;align-items:center;flex:none;padding-top:2px}
.slib-cn{
  font-size:13.5px;line-height:1.85;color:var(--ink-2);margin-top:9px;
  padding:10px 13px;background:#f6f7ff;border-radius:10px;animation:ansFade .3s both;
}
.dot.d1{background:#bfe8d8}.dot.d2{background:#f8ddb3}.dot.d3{background:#f6c9c6}
.stat-num{font-size:26px;font-weight:700;letter-spacing:-.5px}
.empty-hint{padding:34px 10px;text-align:center;color:var(--muted);font-size:13px;line-height:1.8}

@media (max-width:760px){
  .sent-card{padding:20px 18px 18px}
  .sent-en{font-size:19px;line-height:1.7}
  .sent-cn{font-size:15.5px}
  .answer-placeholder{flex-direction:column;align-items:flex-start}
  .answer-placeholder .btn{width:100%}
  .tr-out-box{min-height:130px;font-size:15.5px}
  textarea.tr-input{min-height:130px}
}
</style>
</head>
<body>

<div id="boot">
  <div>
    <div class="boot-mark">句</div>
    <div class="boot-text">正在装载句库</div>
  </div>
</div>

<aside class="sidebar">
  <div class="brand">
    <div class="brand-mark">句</div>
    <div class="brand-text"><b>高考长难句</b><span>NCEE SENTENCES</span></div>
  </div>
  <nav class="nav" id="nav"></nav>
  <div class="side-foot">
    <div class="share-card">
      <b>手机扫码练翻译</b>
      <p>用手机扫描二维码，随时随地练长难句。</p>
      <button class="btn soft" data-act="share">获取二维码与链接</button>
    </div>
    <div class="side-note" id="sideNote">句库收录高考长难句，练习记录保存在本机浏览器。</div>
  </div>
</aside>

<main>
  <div class="topbar">
    <div>
      <div class="page-title" id="pageTitle">翻译练习</div>
      <div class="page-sub" id="pageSub">先自己译一遍，再对照参考译文。</div>
    </div>
    <div class="top-actions">
      <div class="streak-chip" id="streakChip"></div>
      <button class="icon-btn" data-act="share" title="分享链接 / 二维码" aria-label="分享">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.6" y1="13.5" x2="15.4" y2="17.5"/><line x1="15.4" y1="6.5" x2="8.6" y2="10.5"/></svg>
      </button>
    </div>
  </div>
  <div id="view"></div>
</main>

<nav class="tabbar" id="tabbar"></nav>

<div class="overlay" id="overlay" data-act="close-layers"></div>

<div class="modal" id="shareModal" role="dialog" aria-modal="true">
  <h2>扫码或复制链接</h2>
  <p>在手机浏览器打开，练习记录自动保存在本机。</p>
  <div id="shareWarn"></div>
  <div class="qr-wrap" id="qrbox"></div>
  <div class="link-box">
    <input id="shareLink" spellcheck="false">
    <button class="btn soft" data-act="copy-link">复制</button>
    <button class="btn soft" data-act="regen-qr">刷新码</button>
  </div>
  <div class="share-tip" id="shareTip">同一网络下可直接打开；公网访问请将目录部署到任意静态服务器。</div>
  <div class="summary-actions" style="margin-top:16px">
    <button class="btn ghost" data-act="download-qr">保存二维码</button>
    <button class="btn primary" data-act="close-layers">完成</button>
  </div>
</div>

<div id="toast"></div>

<script src="qrcode.min.js"></script>
<script src="sentences.js"></script>
<script>
(function(){
'use strict';

/* ================= 数据与存储 ================= */
var S = window.GK_SENTENCES || [];
var N = S.length;
var DIFF_NAME = {1:'中等', 2:'较难', 3:'困难'};
var KEY = {rec:'gks.rec.v1', act:'gks.act.v1', meta:'gks.meta.v1'};
var DAY = 86400000;

function load(k, def){
  try{ var v = localStorage.getItem(k); return v ? JSON.parse(v) : def; }catch(e){ return def; }
}
function save(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }

var records = load(KEY.rec, {});      // 句子索引 -> {st:'know'|'again', star:true, seen:n, ts}
var activity = load(KEY.act, {});     // 'YYYY-MM-DD' -> {p:练习, t:翻译}
var meta = load(KEY.meta, {goal:10, tab:'practice', diff:0, order:'seq', showTip:true, cur:0});

var state = {
  tab: meta.tab || 'practice',
  diff: meta.diff || 0,
  order: meta.order || 'seq',
  showTip: meta.showTip !== false,
  cur: meta.cur || 0,
  revealed: false,
  onlyExam: !!meta.onlyExam, examYear: meta.examYear || 0,
  libQ: '', libDiff: 0, libFilter: 'all', libLimit: 60, libOpen: {},
  examYearFilter: 0, examLimit: 80, examOpen: {},
  trText: '', trResult: '', trRef: null, trBusy: false, trNote: ''
};

function persistMeta(){
  meta.tab = state.tab; meta.diff = state.diff; meta.order = state.order;
  meta.showTip = state.showTip; meta.cur = state.cur;
  meta.onlyExam = state.onlyExam; meta.examYear = state.examYear;
  save(KEY.meta, meta);
}

/* ================= 基础工具 ================= */
var $ = function(s, r){ return (r || document).querySelector(s); };
var esc = function(s){
  return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
};
var pad = function(n){ return n < 10 ? '0' + n : '' + n; };
var dkey = function(d){
  d = d || new Date();
  return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
};

function logAct(kind){
  var k = dkey();
  if(!activity[k]) activity[k] = {p:0, t:0};
  if(kind === 'translate') activity[k].t = (activity[k].t || 0) + 1;
  else activity[k].p = (activity[k].p || 0) + 1;
  save(KEY.act, activity);
}
function todayP(){ var a = activity[dkey()]; return a ? (a.p || 0) : 0; }
function todayT(){ var a = activity[dkey()]; return a ? (a.t || 0) : 0; }
function streak(){
  var n = 0, t = Date.now();
  for(var i = 0; i < 400; i++){
    var a = activity[dkey(new Date(t))];
    if(a && ((a.p || 0) + (a.t || 0)) > 0){ n++; t -= DAY; }
    else if(i === 0){ t -= DAY; }
    else break;
  }
  return n;
}

/* ================= 图标 ================= */
var ICONS = {
  book: '<path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H19v15H6.5A2.5 2.5 0 0 0 4 20.5z"/><path d="M4 20.5A2.5 2.5 0 0 1 6.5 18H19v3H6.5A2.5 2.5 0 0 1 4 20.5z"/>',
  list: '<line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><circle cx="4" cy="6" r="1"/><circle cx="4" cy="12" r="1"/><circle cx="4" cy="18" r="1"/>',
  lang: '<path d="M3 5h10"/><path d="M8 3v2c0 4.5-3.5 8-6 8"/><path d="M5 8c1 3 3.5 5 6 5"/><path d="M13 21l4-9 4 9"/><path d="M15.2 16.5h3.6"/>',
  chart: '<line x1="4" y1="20" x2="20" y2="20"/><rect x="6" y="11" width="3.2" height="6" rx="1"/><rect x="11.2" y="7" width="3.2" height="10" rx="1"/><rect x="16.4" y="13" width="3.2" height="4" rx="1"/>',
  eye: '<path d="M2 12s3.6-6.5 10-6.5S22 12 22 12s-3.6 6.5-10 6.5S2 12 2 12z"/><circle cx="12" cy="12" r="2.6"/>',
  check: '<path d="M20 6L9 17l-5-5"/>',
  refresh: '<path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 4v7h-7"/>',
  arrow: '<line x1="5" y1="12" x2="19" y2="12"/><polyline points="13 6 19 12 13 18"/>',
  star: '<path d="M12 3.5l2.7 5.5 6 .9-4.3 4.2 1 6-5.4-2.8-5.4 2.8 1-6L3.3 9.9l6-.9z"/>',
  speak: '<polygon points="11 5 6.5 9 3 9 3 15 6.5 15 11 19 11 5"/><path d="M15.5 9.2a4 4 0 0 1 0 5.6"/><path d="M18.2 6.5a8 8 0 0 1 0 11"/>',
  copy: '<rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/>',
  tag: '<path d="M3 12V4a1 1 0 0 1 1-1h8l9 9-9 9z"/><circle cx="7.5" cy="7.5" r="1.4"/>',
  swap: '<path d="M7 4v13"/><polyline points="3 8 7 4 11 8"/><path d="M17 20V7"/><polyline points="21 16 17 20 13 16"/>',
  trophy: '<path d="M7 4h10v5a5 5 0 0 1-10 0z"/><path d="M7 5H4.5a2.5 2.5 0 0 0 0 5H7"/><path d="M17 5h2.5a2.5 2.5 0 0 1 0 5H17"/><line x1="12" y1="14" x2="12" y2="18"/><path d="M8.5 21h7"/><path d="M10 18h4"/>',
  gear: '<circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M19.1 4.9L17 7M7 17l-2.1 2.1"/>'
};
function icon(name, size){
  var s = size || 18;
  return '<svg viewBox="0 0 24 24" width="' + s + '" height="' + s + '" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">' + (ICONS[name] || '') + '</svg>';
}

function toast(msg){
  var t = $('#toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(t._tid);
  t._tid = setTimeout(function(){ t.classList.remove('show'); }, 1900);
}
function speak(text){
  if(!('speechSynthesis' in window)){ toast('当前浏览器不支持发音'); return; }
  try{
    window.speechSynthesis.cancel();
    var u = new SpeechSynthesisUtterance(String(text).replace(/[“”"]/g, ''));
    u.lang = 'en-US'; u.rate = .86;
    window.speechSynthesis.speak(u);
  }catch(e){ toast('发音失败'); }
}
function copyText(text, tip){
  var done = function(){ toast(tip || '已复制'); };
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(done, function(){ fallbackCopy(text, done); });
  }else fallbackCopy(text, done);
}
function fallbackCopy(text, done){
  try{
    var ta = document.createElement('textarea');
    ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select(); document.execCommand('copy'); ta.remove();
    done();
  }catch(e){ toast('复制失败，请手动选择'); }
}

/* ================= 句子池 ================= */
function pool(){
  var arr = [];
  for(var i = 0; i < N; i++){
    if(state.diff && S[i].d !== state.diff) continue;
    if(state.onlyExam && !S[i].p) continue;            // 只练历年真题
    if(state.examYear && S[i].y !== state.examYear) continue;  // 只练某一年真题
    arr.push(i);
  }
  arr.sort(function(a, b){
    var ra = rank(a), rb = rank(b);
    if(ra !== rb) return ra - rb;                      // 未练 > 需再看 > 已理解
    return S[a].n - S[b].n || a - b;                    // 短句优先，循序渐进
  });
  return arr;
}
function rank(i){
  var r = records[i];
  if(!r || !r.st) return 0;
  return r.st === 'know' ? 2 : 1;
}
function currentIndex(){
  var p = pool();
  if(!p.length) return -1;
  if(p.indexOf(state.cur) === -1) return p[0];
  return state.cur;
}
function nextSentence(step){
  var p = pool();
  if(!p.length){ state.revealed = false; return; }
  var i;
  if(state.order === 'rand'){
    if(p.length === 1) i = p[0];
    else{
      var guard = 0;
      do{ i = p[Math.floor(Math.random() * p.length)]; guard++; }
      while(i === state.cur && guard < 30);
    }
  }else{
    var pos = p.indexOf(state.cur);
    i = pos === -1 ? p[0] : p[(pos + (step || 1) + p.length) % p.length];
  }
  state.cur = i;
  state.revealed = false;
  persistMeta();
  renderView();
}

/* ================= 英文结构高亮 ================= */
var CONJ_RE = /\b(that|which|who|whom|whose|when|where|why|how|because|although|though|while|if|unless|since|whether|whatever|whoever|wherever|whenever|so that|even though|in order that|as if|rather than|not only)\b/gi;
function hlEn(txt){
  var out = esc(txt);
  if(!state.showTip) return out;
  return out.replace(CONJ_RE, function(m){ return '<em class="conj">' + m + '</em>'; });
}

/* ================= 导航 ================= */
var TABS = [
  {id:'practice', label:'翻译练习', icon:'book', title:'翻译练习', sub:'先自己译一遍，再对照参考译文。'},
  {id:'exam', label:'历年真题', icon:'trophy', title:'历年真题', sub:'按年份浏览高考真题长难句，逐句核对译文。'},
  {id:'library', label:'句库', icon:'list', title:'句库', sub:'浏览全部长难句，随时展开译文。'},
  {id:'translate', label:'中译英', icon:'lang', title:'中译英', sub:'输入中文，在线翻译成英文并对照句库参考。'},
  {id:'stats', label:'数据', icon:'chart', title:'数据', sub:'练习量、掌握情况与备份。'}
];

function renderNav(){
  var nav = $('#nav');
  nav.innerHTML = TABS.map(function(t){
    return '<button class="nav-item' + (state.tab === t.id ? ' active' : '') + '" data-act="tab" data-tab="' + t.id + '">' +
      icon(t.icon) + '<span>' + t.label + '</span></button>';
  }).join('');

  var tabbar = $('#tabbar');
  tabbar.innerHTML = TABS.map(function(t){
    return '<button class="tab' + (state.tab === t.id ? ' active' : '') + '" data-act="tab" data-tab="' + t.id + '">' +
      icon(t.icon, 21) + '<span>' + t.label + '</span></button>';
  }).join('');

  var cur = TABS.filter(function(t){ return t.id === state.tab; })[0] || TABS[0];
  $('#pageTitle').textContent = cur.title;
  $('#pageSub').textContent = cur.sub;

  var st = streak();
  $('#streakChip').innerHTML = '🔥 <b>' + st + '</b> 天连续';
}

function switchTab(tab){
  state.tab = tab;
  persistMeta();
  renderView();
  window.scrollTo({top:0, behavior:'smooth'});
}

/* ================= 视图分发 ================= */
function renderView(){
  var v = $('#view');
  if(!v) return;
  var fn = {practice:renderPractice, exam:renderExam, library:renderLibrary, translate:renderTranslate, stats:renderStats}[state.tab] || renderPractice;
  fn(v);
  renderNav();
}

/* ================= 翻译练习 ================= */
function renderPractice(v){
  if(!N){
    v.innerHTML = '<div class="card"><div class="empty-hint">句库未加载，请确认 sentences.js 与 index.html 在同一目录。</div></div>';
    return;
  }
  var idx = currentIndex();
  if(idx === -1){
    v.innerHTML = '<div class="card"><div class="empty-hint">该难度下暂无句子，切换难度试试。</div></div>';
    return;
  }
  var s = S[idx];
  var goal = meta.goal || 10;
  var done = todayP();
  var pct = Math.min(100, Math.round(done / goal * 100));
  var rec = records[idx] || {};
  var p = pool();

  var html = '';

  // 今日进度
  html += '<div class="card panel" style="padding:16px 20px;margin-bottom:14px">';
  html += '<div class="sess-bar" style="margin:0"><div class="track"><i style="width:' + pct + '%"></i></div>' +
          '<div class="txt">今日 ' + done + ' / ' + goal + ' 句</div></div>';
  html += '</div>';

  // 选项
  html += '<div class="practice-top">';
  html += '<div class="practice-opts">';
  html += '<div class="mini-seg">';
  [[0,'全部句库'],[1,'历年真题']].forEach(function(o){
    html += '<button class="' + ((state.onlyExam ? 1 : 0) === o[0] ? 'on' : '') + '" data-act="scope" data-v="' + o[0] + '">' + o[1] + '</button>';
  });
  html += '</div>';
  html += '<div class="mini-seg">';
  [[0,'全部'],[1,'中等'],[2,'较难'],[3,'困难']].forEach(function(o){
    html += '<button class="' + (state.diff === o[0] ? 'on' : '') + '" data-act="diff" data-d="' + o[0] + '">' + o[1] + '</button>';
  });
  html += '</div>';
  html += '<div class="mini-seg">';
  [['seq','顺序'],['rand','随机']].forEach(function(o){
    html += '<button class="' + (state.order === o[0] ? 'on' : '') + '" data-act="order" data-o="' + o[0] + '">' + o[1] + '</button>';
  });
  html += '</div>';
  html += '</div>';
  html += '<div class="practice-opts">';
  html += '<button class="chip' + (state.showTip ? ' on' : '') + '" data-act="toggle-tip">' + (state.showTip ? '✓ ' : '') + '从句高亮</button>';
  if(state.examYear){
    html += '<button class="chip on" data-act="clear-year">' + state.examYear + ' 年真题 ✕</button>';
  }
  html += '<span class="small muted">当前范围 ' + p.length + ' 句</span>';
  html += '</div>';
  html += '</div>';

  // 句子卡片
  html += '<div class="card sent-card">';
  html += '<div class="sent-meta">';
  html += '<span class="sent-no">SENTENCE #' + (idx + 1) + '</span>';
  if(s.p) html += '<span class="exam-tag">' + icon('trophy', 12) + '真题' + (s.y ? ' ' + s.y : '') + '</span>';
  html += '<span class="diff-tag d' + s.d + '">' + DIFF_NAME[s.d] + '</span>';
  (s.t || []).forEach(function(t){ html += '<span class="struct-chip">' + esc(t) + '</span>'; });
  html += '<span class="wc-hint" style="margin:0 0 0 auto">' + s.n + ' 词</span>';
  html += '</div>';

  html += '<p class="sent-en">' + hlEn(s.e) + '</p>';

  html += '<div class="tr-tools">' +
          '<button class="icon-btn" data-act="speak-en" title="朗读英文">' + icon('speak', 17) + '</button>' +
          '<button class="icon-btn" data-act="copy-en" title="复制英文">' + icon('copy', 17) + '</button>' +
          (rec.star ? '<button class="icon-btn" data-act="star" title="取消收藏" style="color:var(--amber);border-color:#f3dcb4;background:#fffaf0">' + icon('star', 17) + '</button>'
                    : '<button class="icon-btn" data-act="star" title="收藏本句">' + icon('star', 17) + '</button>') +
          '</div>';

  // 译文区
  if(!state.revealed){
    html += '<div class="answer-zone locked"><div class="answer-placeholder">' +
            '<div class="ph-txt"><b>先自己翻一遍</b>在心里或纸上把这句话译成中文，再核对参考译文。</div>' +
            '<button class="btn primary" data-act="reveal">' + icon('eye', 16) + '查看参考译文</button>' +
            '</div></div>';
  }else{
    html += '<div class="answer-zone">';
    html += '<p class="sent-cn sent-cn-in">' + esc(s.c) + '</p>';
    if(s.s) html += '<div class="src-line">' + icon('tag', 13) + '<span>来源：' + esc(s.s) + '</span></div>';
    html += '</div>';
  }
  html += '</div>';

  // 操作区
  html += '<div style="margin-top:14px">';
  if(state.revealed){
    html += '<div class="rate-bar three" style="margin:0">';
    html += '<button class="rate-btn know" data-act="rate" data-st="know"><b>我理解了</b><span>译得八九不离十</span></button>';
    html += '<button class="rate-btn fuzzy" data-act="rate" data-st="again"><b>需要再看</b><span>加入重点复习</span></button>';
    html += '<button class="rate-btn star' + (rec.star ? ' on' : '') + '" data-act="star"><b>' + (rec.star ? '★ 已收藏' : '☆ 收藏') + '</b><span>稍后再练</span></button>';
    html += '</div>';
    html += '<div style="margin-top:10px;display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap">';
    html += '<div class="keyboard-hint"><kbd>←</kbd> 上一句 <kbd>→</kbd> 下一句</div>';
    html += '<button class="btn primary lg" data-act="next">下一句 ' + icon('arrow', 16) + '</button>';
    html += '</div>';
  }else{
    html += '<div style="display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap">';
    html += '<div class="keyboard-hint"><kbd>空格</kbd> 查看译文 <kbd>→</kbd> 下一句</div>';
    html += '<button class="btn ghost" data-act="next">跳过这句 ' + icon('arrow', 16) + '</button>';
    html += '</div>';
  }
  html += '</div>';

  v.innerHTML = html;
}

function reveal(){
  if(state.revealed) return;
  state.revealed = true;
  var r = records[state.cur] || (records[state.cur] = {seen:0});
  r.seen = (r.seen || 0) + 1;
  r.ts = Date.now();
  logAct('practice');
  save(KEY.rec, records);
  renderView();
}

function rate(st){
  var r = records[state.cur] || (records[state.cur] = {seen:0});
  r.st = st;
  r.ts = Date.now();
  save(KEY.rec, records);
  toast(st === 'know' ? '已标记：我理解了' : '已加入重点复习');
  nextSentence(1);
}

function toggleStar(){
  var idx = state.cur;
  var r = records[idx] || (records[idx] = {seen:0});
  r.star = !r.star;
  if(!r.star && !r.st && !r.seen) delete records[idx];
  save(KEY.rec, records);
  renderView();
}

function setDiff(d){
  state.diff = d;
  persistMeta();
  state.cur = 0;
  state.revealed = false;
  renderView();
}
function setOrder(o){
  state.order = o;
  persistMeta();
  renderView();
}

/* ================= 句库 ================= */
function libList(){
  var q = state.libQ.trim().toLowerCase();
  var out = [];
  for(var i = 0; i < N; i++){
    var s = S[i], r = records[i] || {};
    if(state.libDiff && s.d !== state.libDiff) continue;
    if(state.libFilter === 'star' && !r.star) continue;
    if(state.libFilter === 'new' && r.st) continue;
    if(state.libFilter === 'know' && r.st !== 'know') continue;
    if(state.libFilter === 'again' && r.st !== 'again') continue;
    if(state.libFilter === 'exam' && !s.p) continue;
    if(q && !(s.e.toLowerCase().indexOf(q) >= 0 || s.c.indexOf(state.libQ.trim()) >= 0)) continue;
    out.push(i);
  }
  return out;
}

function libRowsHTML(list){
  if(!list.length) return '<div class="empty-hint">没有匹配的句子，换个关键词或筛选条件试试。</div>';
  var shown = list.slice(0, state.libLimit);
  var html = shown.map(function(i){
    var s = S[i], r = records[i] || {};
    var open = !!state.libOpen[i];
    var st = r.st === 'know' ? '<span class="dot mastered" title="我理解了"></span>'
           : r.st === 'again' ? '<span class="dot book" title="需要再看"></span>'
           : '<span class="dot new" title="未练习"></span>';
    var row = '<div class="slib-row' + (open ? ' open' : '') + '">';
    row += '<div class="slib-head" data-act="lib-open" data-i="' + i + '">';
    row += '<div class="slib-en' + (open ? '' : ' clamp') + '">' + esc(s.e) + '</div>';
    row += '<div class="slib-side">' + (r.star ? '<span style="color:var(--amber)">' + icon('star', 13) + '</span>' : '') +

/* ================= 中译英 ================= */
function bigrams(str){
  var s = String(str).replace(/[\s，。！？、；：“”‘’（）,.!?;:'"()\[\]]/g, '');
  var out = {};
  for(var i = 0; i < s.length - 1; i++){
    var g = s.substr(i, 2);
    out[g] = (out[g] || 0) + 1;
  }
  return out;
}
function similar(a, b){
  var A = bigrams(a), B = bigrams(b), inter = 0, uni = 0, k;
  for(k in A){ if(B[k]) inter += Math.min(A[k], B[k]); }
  for(k in A) uni += A[k];
  for(k in B) uni += B[k];
  return uni ? 2 * inter / uni : 0;
}
function bestMatch(cn){
  var best = -1, bs = 0;
  for(var i = 0; i < N; i++){
    var sc = similar(cn, S[i].c);
    if(sc > bs){ bs = sc; best = i; }
  }
  return (best >= 0 && bs >= 0.45) ? {i:best, score:bs} : null;
}

function doTranslate(){
  var text = state.trText.trim();
  if(!text){ toast('请先输入中文内容'); return; }
  if(state.trBusy) return;
  state.trBusy = true;
  state.trNote = '';
  renderView();

  var url = 'https://aidemo.youdao.com/trans';
  fetch(url, {
    method: 'POST',
    headers: {'Content-Type': 'application/x-www-form-urlencoded'},
    body: 'q=' + encodeURIComponent(text) + '&from=zh-CHS&to=en'
  }).then(function(r){
    if(!r.ok) throw new Error('http ' + r.status);
    return r.json();
  }).then(function(j){
    state.trBusy = false;
    var out = (j && j.translation && j.translation.length) ? j.translation.join(' ') : '';
    if(!out) throw new Error('empty');
    state.trResult = out;
    state.trRef = bestMatch(text);
    logAct('translate');
    state.trNote = '';
    renderView();
  }).catch(function(){
    state.trBusy = false;
    var m = bestMatch(text);
    state.trResult = '';
    state.trRef = m;
    state.trNote = m
      ? '在线翻译暂时不可用（可能无网络或被拦截），下面给出句库中语义最接近的参考译文。'
      : '在线翻译暂时不可用（可能无网络或被拦截），句库中也没有相近的参考译文。请检查网络后重试。';
    renderView();
  });
}

function statCard(k, val, suffix, foot){
  return '<div class="card stat"><div class="k">' + k + '</div><b>' + val + (suffix || '') + '</b><div class="foot">' + foot + '</div></div>';
}
function chartHTML(){
  var days = [];
  for(var i = 13; i >= 0; i--){
    var d = new Date(Date.now() - i * DAY), k = dkey(d), a = activity[k] || {};
    days.push({label: (d.getMonth() + 1) + '/' + d.getDate(), p: a.p || 0, t: a.t || 0});
  }
  var max = 5;
  days.forEach(function(d){ max = Math.max(max, d.p + d.t); });
  var html = '<div class="chart">';
  days.forEach(function(d, idx){
    var total = d.p + d.t;
    html += '<div class="bar-col">';
    html += '<div class="bar-stack' + (total ? '' : ' empty') + '">';
    if(total){
      html += '<i class="learn" style="height:' + (d.p / total * 100) + '%"></i>';
      html += '<i class="rev" style="height:' + (d.t / total * 100) + '%"></i>';
    }
    html += '</div>';
    html += '<em>' + (idx % 2 === 0 || idx === days.length - 1 ? d.label : '') + '</em>';
    html += '</div>';
  });
  return html + '</div>';
}

function exportData(){
  var payload = {version: 1, exportedAt: new Date().toISOString(), records: records, activity: activity, meta: meta, total: N};
  var blob = new Blob([JSON.stringify(payload, null, 1)], {type: 'application/json'});
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'gaokao-sentences-' + dkey() + '.json';
  document.body.appendChild(a); a.click();
  setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); }, 1000);
  toast('练习记录已导出');
}
function importData(e){
  var file = e.target.files && e.target.files[0];
  if(!file) return;
  var reader = new FileReader();
  reader.onload = function(){
    try{
      var d = JSON.parse(reader.result);
      if(d.records && typeof d.records === 'object'){ records = d.records; save(KEY.rec, records); }
      if(d.activity && typeof d.activity === 'object'){ activity = d.activity; save(KEY.act, activity); }
      if(d.meta){ meta = Object.assign(meta, d.meta); persistMeta(); }
      toast('导入成功');
      renderView();
    }catch(err){ toast('文件格式不正确'); }
  };
  reader.readAsText(file);
  e.target.value = '';
}
function resetAll(){
  if(!confirm('确定清空全部练习记录吗？该操作不可撤销。')) return;
  records = {}; activity = {};
  save(KEY.rec, records); save(KEY.act, activity);
  toast('已清空练习记录');
  renderView();
}

      return;
    }catch(e){}
  }
  box.innerHTML = '<div style="font-size:12px;color:#7b8194;text-align:center;padding:20px">二维码组件未加载</div>';
}

/* ================= 事件 ================= */
document.addEventListener('click', function(e){
  var el = e.target.closest ? e.target.closest('[data-act]') : null;
  if(!el) return;
  var act = el.getAttribute('data-act');

  if(act === 'tab'){ switchTab(el.getAttribute('data-tab')); return; }
  if(act === 'share'){ openShare(); return; }
  if(act === 'close-layers'){ closeLayers(); return; }
  if(act === 'copy-link'){ copyText($('#shareLink').value, '链接已复制'); return; }
  if(act === 'regen-qr'){ drawQR(location.href); toast('二维码已刷新'); return; }
  if(act === 'download-qr'){
    var cvs = $('#qrbox canvas');
    if(cvs){
      var a = document.createElement('a');
      a.href = cvs.toDataURL('image/png');
      a.download = 'gaokao-sentences-qr.png';
      document.body.appendChild(a); a.click(); a.remove();
      toast('二维码已保存');
    }else toast('暂无二维码可保存');
    return;
  }

  if(act === 'reveal'){ reveal(); return; }
  if(act === 'rate'){ rate(el.getAttribute('data-st')); return; }
  if(act === 'star'){ toggleStar(); return; }
  if(act === 'next'){ nextSentence(1); return; }
  if(act === 'diff'){ setDiff(parseInt(el.getAttribute('data-d'), 10)); return; }
  if(act === 'order'){ setOrder(el.getAttribute('data-o')); return; }
  if(act === 'toggle-tip'){ state.showTip = !state.showTip; persistMeta(); renderView(); return; }
  if(act === 'scope'){
    state.onlyExam = el.getAttribute('data-v') === '1';
    if(!state.onlyExam) state.examYear = 0;
    state.cur = 0; state.revealed = false;
    persistMeta(); renderView();
    return;
  }
  if(act === 'clear-year'){
    state.examYear = 0; state.cur = 0; state.revealed = false;
    persistMeta(); renderView();
    return;
  }
  if(act === 'speak-en'){ speak(S[currentIndex()].e); return; }
  if(act === 'copy-en'){ copyText(S[currentIndex()].e, '英文已复制'); return; }

  if(act === 'exam-year'){
    state.examYearFilter = parseInt(el.getAttribute('data-y'), 10) || 0;
    state.examLimit = 80;
    renderView();
    return;
  }
  if(act === 'exam-open'){
    var e0 = parseInt(el.getAttribute('data-i'), 10);
    state.examOpen[e0] = !state.examOpen[e0];
    renderView();
    return;
  }
  if(act === 'exam-more'){ state.examLimit += 80; renderView(); return; }
  if(act === 'exam-practice'){
    state.onlyExam = true;
    state.examYear = parseInt(el.getAttribute('data-y'), 10) || 0;
    state.cur = 0; state.revealed = false;
    persistMeta();
    switchTab('practice');
    return;
  }

  if(act === 'lib-open'){
    var i = parseInt(el.getAttribute('data-i'), 10);
    state.libOpen[i] = !state.libOpen[i];
    refreshLib();
    return;
  }
  if(act === 'lib-star'){
    var j = parseInt(el.getAttribute('data-i'), 10);
    var r = records[j] || (records[j] = {seen:0});
    r.star = !r.star;
    save(KEY.rec, records);
    if(state.tab === 'exam') renderView(); else refreshLib();
    return;
  }
  if(act === 'lib-speak'){ speak(S[parseInt(el.getAttribute('data-i'), 10)].e); return; }
  if(act === 'lib-more'){ state.libLimit += 60; refreshLib(); return; }
  if(act === 'lib-diff'){ state.libDiff = parseInt(el.getAttribute('data-d'), 10); state.libLimit = 60; renderView(); return; }
  if(act === 'lib-filter'){ state.libFilter = el.getAttribute('data-f'); state.libLimit = 60; renderView(); return; }

  if(act === 'tr-go'){ doTranslate(); return; }
  if(act === 'tr-clear'){ state.trText = ''; state.trResult = ''; state.trRef = null; state.trNote = ''; renderView(); return; }
  if(act === 'tr-copy'){ copyText(state.trResult, '译文已复制'); return; }
  if(act === 'tr-speak'){ speak(state.trResult); return; }
  if(act === 'tr-sample'){
    state.trText = el.getAttribute('data-t');
    state.trResult = ''; state.trRef = null; state.trNote = '';
    renderView();
    return;
  }

  if(act === 'export-data'){ exportData(); return; }
  if(act === 'import-data'){ var f = $('#importFile'); if(f) f.click(); return; }
  if(act === 'reset-all'){ resetAll(); return; }
});

document.addEventListener('keydown', function(e){
  if(state.tab !== 'practice') return;
  var tag = (e.target.tagName || '').toLowerCase();
  if(tag === 'input' || tag === 'textarea') return;
  if(e.key === ' ' || e.key === 'Enter'){
    e.preventDefault();
    if(!state.revealed) reveal();
    else nextSentence(1);
  }else if(e.key === 'ArrowRight'){
    e.preventDefault(); nextSentence(1);
  }else if(e.key === 'ArrowLeft'){
    e.preventDefault(); nextSentence(-1);
  }
});

/* ================= 启动 ================= */
function boot(){
  var b = $('#boot');
  if(b){
    b.classList.add('hide');
    setTimeout(function(){ if(b.parentNode) b.parentNode.removeChild(b); }, 380);
  }
  var note = $('#sideNote');
  if(note) note.textContent = '句库收录 ' + N + ' 条高考长难句，练习记录保存在本机浏览器。';
  renderView();
}
if(document.readyState === 'complete' || document.readyState === 'interactive') setTimeout(boot, 0);
else window.addEventListener('DOMContentLoaded', boot);

})();
</script>
</body>
</html>
